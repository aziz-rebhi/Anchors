name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────
  # Linux
  # ─────────────────────────────────────────
  linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qtshadertools'
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsodium-dev \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libegl1 \
            libfontconfig1-dev \
            libdbus-1-dev

      - name: Build
        run: |
          export PATH="${Qt6_DIR}/bin:${PATH}"
          qmake Anchors.pro CONFIG+=release
          make -j"$(nproc)"

      - name: Locate binary
        run: |
          BIN="$(find . -type f -name Anchors -executable | head -1)"
          echo "Binary: $BIN"
          test -n "$BIN"
          cp "$BIN" Anchors-linux-x86_64
          chmod +x Anchors-linux-x86_64

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: Anchors-linux-x86_64

  # ─────────────────────────────────────────
  # Windows (MinGW)
  # ─────────────────────────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt (MinGW)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: windows
          target: desktop
          arch: win64_mingw
          tools: 'tools_mingw1310'
          modules: 'qtshadertools'
          cache: true

      - name: Install libsodium (vcpkg mingw)
        run: vcpkg install libsodium:x64-mingw-dynamic

      - name: Build
        shell: cmd
        run: |
          set PATH=%Qt6_DIR%\bin;%IQTA_TOOLS%\mingw1310_64\bin;%PATH%
          set VCPKG_ROOT=%VCPKG_INSTALLATION_ROOT%
          set INCLUDE=%VCPKG_ROOT%\installed\x64-mingw-dynamic\include;%INCLUDE%
          set LIBRARY_PATH=%VCPKG_ROOT%\installed\x64-mingw-dynamic\lib;%LIBRARY_PATH%
          set PATH=%VCPKG_ROOT%\installed\x64-mingw-dynamic\bin;%PATH%

          where g++
          where mingw32-make
          where qmake

          qmake Anchors.pro CONFIG+=release
          if errorlevel 1 exit /b 1
          mingw32-make -j%NUMBER_OF_PROCESSORS%
          if errorlevel 1 exit /b 1

      - name: Deploy + zip
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter Anchors.exe |
            Where-Object { $_.FullName -notmatch '\\dist-windows\\' } |
            Select-Object -First 1
          if (-not $exe) { throw "Anchors.exe not found" }
          Write-Host "EXE: $($exe.FullName)"

          $windeploy = $null
          if ($env:Qt6_DIR -and (Test-Path "$env:Qt6_DIR\bin\windeployqt.exe")) {
            $windeploy = "$env:Qt6_DIR\bin\windeployqt.exe"
          }
          if (-not $windeploy) {
            $qmakeCmd = Get-Command qmake -ErrorAction SilentlyContinue
            if ($qmakeCmd) {
              $candidate = Join-Path (Split-Path $qmakeCmd.Source) "windeployqt.exe"
              if (Test-Path $candidate) { $windeploy = $candidate }
            }
          }
          if (-not $windeploy) {
            $windeploy = (
              Get-ChildItem -Path "D:\a", "C:\a" -Recurse -Filter "windeployqt.exe" -ErrorAction SilentlyContinue |
              Select-Object -First 1
            ).FullName
          }
          if (-not $windeploy -or -not (Test-Path $windeploy)) {
            throw "windeployqt.exe not found. Qt6_DIR='$($env:Qt6_DIR)'"
          }
          Write-Host "windeployqt: $windeploy"

          $out = "dist-windows"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item $exe.FullName "$out\Anchors.exe"

          & $windeploy --release --qmldir ui "$out\Anchors.exe"
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed with $LASTEXITCODE" }

          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if ($vcpkg) {
            Get-ChildItem "$vcpkg\installed\x64-mingw-dynamic\bin\*sodium*.dll" -ErrorAction SilentlyContinue |
              ForEach-Object {
                Copy-Item $_.FullName $out
                Write-Host "Copied $($_.Name)"
              }
          }

          $gpp = Get-Command g++ -ErrorAction SilentlyContinue
          if ($gpp) {
            $mingwBin = Split-Path $gpp.Source
            foreach ($dll in @("libgcc_s_seh-1.dll", "libstdc++-6.dll", "libwinpthread-1.dll")) {
              $src = Join-Path $mingwBin $dll
              if (Test-Path $src) {
                Copy-Item $src $out
                Write-Host "Copied $dll"
              }
            }
          }

          Compress-Archive -Path "$out\*" -DestinationPath Anchors-windows-x64.zip -Force
          Write-Host "Created Anchors-windows-x64.zip"

      - name: Upload Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: Anchors-windows-x64.zip

  # ─────────────────────────────────────────
  # Publish GitHub Release
  # ─────────────────────────────────────────
  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Anchors ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            Automated build of **Anchors** `${{ github.ref_name }}`.

            ### Downloads
            - **Windows:** `Anchors-windows-x64.zip` — extract and run `Anchors.exe`
            - **Linux:** `Anchors-linux-x86_64` — needs system Qt 6 + libsodium (or use a local AppImage for portability)

            ### Notes
            Windows build uses MinGW + windeployqt.
            Linux CI binary is dynamically linked; AppImage can be added later.
          files: |
            artifacts/linux-binary/Anchors-linux-x86_64
            artifacts/windows-zip/Anchors-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
