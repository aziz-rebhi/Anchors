name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qtshadertools'
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsodium-dev \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libegl1 \
            libfontconfig1-dev \
            libdbus-1-dev

      - name: Build
        run: |
          export PATH="${Qt6_DIR}/bin:${PATH}"
          qmake Anchors.pro CONFIG+=release
          make -j"$(nproc)"

      - name: Locate binary
        run: |
          BIN="$(find . -type f -name Anchors -executable | head -1)"
          echo "Binary: $BIN"
          test -n "$BIN"
          cp "$BIN" Anchors-linux-x86_64
          chmod +x Anchors-linux-x86_64

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: Anchors-linux-x86_64

  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          modules: 'qtshadertools'
          cache: true

      - name: Install libsodium (vcpkg)
        run: vcpkg install libsodium:x64-windows

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        shell: cmd
        run: |
          set VCPKG_ROOT=%VCPKG_INSTALLATION_ROOT%
          set PATH=%Qt6_DIR%\bin;%PATH%

          where cl
          where nmake
          where qmake

          rem Required: qmake on GHA does not auto-detect MSC version
          set QMAKE_MSC_VER=1949

          qmake -spec win32-msvc Anchors.pro CONFIG+=release
          if errorlevel 1 exit /b 1

          if not exist Makefile (
            echo ERROR: Makefile was not generated by qmake
            dir
            exit /b 1
          )

          nmake
          if errorlevel 1 exit /b 1

      - name: Deploy Qt + zip
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter Anchors.exe | Select-Object -First 1
          if (-not $exe) {
            Get-ChildItem -Recurse -Filter *.exe | Select-Object -ExpandProperty FullName
            throw "Anchors.exe not found"
          }
          Write-Host "Using $($exe.FullName)"
          $out = "dist-windows"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item $exe.FullName "$out\Anchors.exe"
          & "$env:Qt6_DIR\bin\windeployqt.exe" --release --qmldir ui "$out\Anchors.exe"
          $sodium = Get-ChildItem "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin\libsodium*.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($sodium) {
            Copy-Item $sodium.FullName $out
          } else {
            Write-Warning "libsodium DLL not found"
          }
          Compress-Archive -Path "$out\*" -DestinationPath Anchors-windows-x64.zip -Force

      - name: Upload Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: Anchors-windows-x64.zip

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Anchors ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            Automated build of **Anchors** `${{ github.ref_name }}`.

            - **Windows:** `Anchors-windows-x64.zip` — extract and run `Anchors.exe`
            - **Linux:** `Anchors-linux-x86_64` — needs system Qt 6 + libsodium
          files: |
            artifacts/linux-binary/Anchors-linux-x86_64
            artifacts/windows-zip/Anchors-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
