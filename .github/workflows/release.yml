name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qtshadertools'
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsodium-dev \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libegl1 \
            libfontconfig1-dev \
            libdbus-1-dev

      - name: Build
        run: |
          export PATH="${Qt6_DIR}/bin:${PATH}"
          qmake Anchors.pro CONFIG+=release
          make -j"$(nproc)"

      - name: Locate binary
        run: |
          BIN="$(find . -type f -name Anchors -executable | head -1)"
          echo "Binary: $BIN"
          test -n "$BIN"
          cp "$BIN" Anchors-linux-x86_64
          chmod +x Anchors-linux-x86_64

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: Anchors-linux-x86_64

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt (MinGW)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: windows
          target: desktop
          arch: win64_mingw
          tools: 'tools_mingw1310'
          cache: true

      - name: Install libsodium (vcpkg mingw)
        run: vcpkg install libsodium:x64-mingw-dynamic

      - name: Build
        shell: cmd
        run: |
          set PATH=%Qt6_DIR%\bin;%IQTA_TOOLS%\mingw1310_64\bin;%PATH%
          set VCPKG_ROOT=%VCPKG_INSTALLATION_ROOT%
          set INCLUDE=%VCPKG_ROOT%\installed\x64-mingw-dynamic\include;%INCLUDE%
          set LIBRARY_PATH=%VCPKG_ROOT%\installed\x64-mingw-dynamic\lib;%LIBRARY_PATH%
          set PATH=%VCPKG_ROOT%\installed\x64-mingw-dynamic\bin;%PATH%

          where g++
          where mingw32-make
          where qmake

          qmake Anchors.pro CONFIG+=release
          if errorlevel 1 exit /b 1
          mingw32-make -j%NUMBER_OF_PROCESSORS%
          if errorlevel 1 exit /b 1

      - name: Deploy + zip
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter Anchors.exe | Select-Object -First 1
          if (-not $exe) { throw "Anchors.exe not found" }
          $out = "dist-windows"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item $exe.FullName "$out\Anchors.exe"
          & "$env:Qt6_DIR\bin\windeployqt.exe" --release --qmldir ui "$out\Anchors.exe"
          $sodium = Get-ChildItem "$env:VCPKG_INSTALLATION_ROOT\installed\x64-mingw-dynamic\bin\*sodium*.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($sodium) { Copy-Item $sodium.FullName $out }
          # MinGW runtime DLLs often needed:
          $mingwBin = Get-ChildItem -Path "$env:IQTA_TOOLS" -Recurse -Filter "libstdc++-6.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($mingwBin) {
            Copy-Item (Join-Path $mingwBin.DirectoryName "*.dll") $out -ErrorAction SilentlyContinue
          }
          Compress-Archive -Path "$out\*" -DestinationPath Anchors-windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: Anchors-windows-x64.zip

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Anchors ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            Automated build of **Anchors** `${{ github.ref_name }}`.

            - **Windows:** `Anchors-windows-x64.zip` — extract and run `Anchors.exe`
            - **Linux:** `Anchors-linux-x86_64` — needs system Qt 6 + libsodium
          files: |
            artifacts/linux-binary/Anchors-linux-x86_64
            artifacts/windows-zip/Anchors-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
