name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────
  # Linux (portable binary)
  # ─────────────────────────────────────────
  linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qtshadertools'
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsodium-dev \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libegl1 \
            libfontconfig1-dev \
            libdbus-1-dev

      - name: Build
        run: |
          export PATH="${Qt6_DIR}/bin:${PATH}"
          VER="${GITHUB_REF_NAME#v}"
          echo "Building Linux VERSION=$VER"
          qmake Anchors.pro CONFIG+=release VERSION="$VER"
          make -j"$(nproc)"

      - name: Locate binary
        run: |
          BIN="$(find . -type f -name Anchors -executable | head -1)"
          echo "Binary: $BIN"
          test -n "$BIN"
          cp "$BIN" Anchors-linux-x86_64
          chmod +x Anchors-linux-x86_64

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: Anchors-linux-x86_64

  # ─────────────────────────────────────────
  # Flatpak
  # ─────────────────────────────────────────
  flatpak:
    name: Flatpak
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.7
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Anchors.flatpak
          manifest-path: flatpak/org.anchors.Anchors.yml
          cache-key: flatpak-${{ runner.os }}-${{ hashFiles('flatpak/**', 'Anchors.pro', 'app/**', 'core/**', 'ui/**') }}

      - name: Upload Flatpak
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: Anchors.flatpak

  # ─────────────────────────────────────────
  # Windows (MinGW) + Inno Setup
  # ─────────────────────────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt (MinGW)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: windows
          target: desktop
          arch: win64_mingw
          tools: 'tools_mingw1310'
          modules: 'qtshadertools'
          cache: true

      - name: Install libsodium (vcpkg mingw)
        run: vcpkg install libsodium:x64-mingw-dynamic

      # Use cmd so -j is not eaten by PowerShell
      - name: Build
        shell: cmd
        run: |
          set PATH=%Qt6_DIR%\bin;%IQTA_TOOLS%\mingw1310_64\bin;%VCPKG_INSTALLATION_ROOT%\installed\x64-mingw-dynamic\bin;%PATH%
          set INCLUDE=%VCPKG_INSTALLATION_ROOT%\installed\x64-mingw-dynamic\include;%INCLUDE%
          set LIB=%VCPKG_INSTALLATION_ROOT%\installed\x64-mingw-dynamic\lib;%LIB%
          set LIBRARY_PATH=%VCPKG_INSTALLATION_ROOT%\installed\x64-mingw-dynamic\lib;%LIBRARY_PATH%

          set VER=%GITHUB_REF_NAME%
          if "%VER:~0,1%"=="v" set VER=%VER:~1%
          if "%VER%"=="" set VER=0.0.0
          echo Building Windows VERSION=%VER%

          where g++
          where mingw32-make
          where qmake

          qmake Anchors.pro CONFIG+=release VERSION=%VER%
          if errorlevel 1 exit /b 1

          mingw32-make -j%NUMBER_OF_PROCESSORS%
          if errorlevel 1 exit /b 1

      - name: Stage deploy folder
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter Anchors.exe |
            Where-Object { $_.FullName -notmatch '\\dist-windows\\' } |
            Select-Object -First 1
          if (-not $exe) { throw "Anchors.exe not found after build" }
          Write-Host "EXE: $($exe.FullName)"

          $out = "dist-windows"
          if (Test-Path $out) { Remove-Item -Recurse -Force $out }
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item $exe.FullName "$out\Anchors.exe"

          $windeploy = $null
          if ($env:Qt6_DIR -and (Test-Path "$env:Qt6_DIR\bin\windeployqt.exe")) {
            $windeploy = "$env:Qt6_DIR\bin\windeployqt.exe"
          }
          if (-not $windeploy) {
            $qmakeCmd = Get-Command qmake -ErrorAction SilentlyContinue
            if ($qmakeCmd) {
              $candidate = Join-Path (Split-Path $qmakeCmd.Source) "windeployqt.exe"
              if (Test-Path $candidate) { $windeploy = $candidate }
            }
          }
          if (-not $windeploy) {
            $found = Get-ChildItem -Path "D:\a", "C:\a" -Recurse -Filter "windeployqt.exe" -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($found) { $windeploy = $found.FullName }
          }
          if (-not $windeploy -or -not (Test-Path $windeploy)) {
            throw "windeployqt.exe not found. Qt6_DIR='$($env:Qt6_DIR)'"
          }
          Write-Host "windeployqt: $windeploy"
          & $windeploy --release --qmldir ui "$out\Anchors.exe"
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed with $LASTEXITCODE" }

          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if ($vcpkg) {
            Get-ChildItem "$vcpkg\installed\x64-mingw-dynamic\bin\*sodium*.dll" -ErrorAction SilentlyContinue |
              ForEach-Object { Copy-Item $_.FullName $out -Force }
          }

          $gpp = Get-Command g++ -ErrorAction SilentlyContinue
          if ($gpp) {
            $mingwBin = Split-Path $gpp.Source
            foreach ($dll in @("libgcc_s_seh-1.dll", "libstdc++-6.dll", "libwinpthread-1.dll")) {
              $src = Join-Path $mingwBin $dll
              if (Test-Path $src) { Copy-Item $src $out -Force }
            }
          }

          # OpenSSL for HTTPS (in-app update check)
          $qtBin = Join-Path $env:Qt6_DIR "bin"
          foreach ($dll in @(
            "libssl-3-x64.dll", "libcrypto-3-x64.dll",
            "libssl-1_1-x64.dll", "libcrypto-1_1-x64.dll"
          )) {
            $src = Join-Path $qtBin $dll
            if (Test-Path $src) {
              Copy-Item $src $out -Force
              Write-Host "Copied OpenSSL from Qt: $dll"
            }
          }
          if ($vcpkg) {
            Get-ChildItem "$vcpkg\installed\x64-mingw-dynamic\bin\libssl*.dll",
                          "$vcpkg\installed\x64-mingw-dynamic\bin\libcrypto*.dll" -ErrorAction SilentlyContinue |
              ForEach-Object {
                Copy-Item $_.FullName $out -Force
                Write-Host "Copied OpenSSL from vcpkg: $($_.Name)"
              }
          }

          Write-Host "Deploy folder:"
          Get-ChildItem $out | Format-Table Name, Length

          Compress-Archive -Path "$out\*" -DestinationPath Anchors-windows-x64.zip -Force
          Write-Host "Created Anchors-windows-x64.zip"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          if (-not $ver) { $ver = "0.0.0" }
          Write-Host "Building installer version $ver"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" installer\Anchors.iss
          Get-ChildItem installer\output\

      - name: Upload Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: Anchors-windows-x64.zip

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: installer/output/Anchors-Setup-*.exe

  # ─────────────────────────────────────────
  # Publish GitHub Release
  # ─────────────────────────────────────────
  release:
    needs: [linux, windows, flatpak]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Anchors ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            Automated build of **Anchors** `${{ github.ref_name }}`.

            ### Downloads
            - **Windows installer:** `Anchors-Setup-*.exe` — full install, optional desktop shortcut
            - **Windows portable:** `Anchors-windows-x64.zip` — extract and run
            - **Linux binary:** `Anchors-linux-x86_64` — needs system Qt 6 + libsodium
            - **Flatpak:** `Anchors.flatpak`
