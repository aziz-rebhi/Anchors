
name: Release

on:
  push:
    tags:
      - 'v*'   # v1.0.0, v0.2.1, ...

permissions:
  contents: write   # create release + upload assets

jobs:
  # ─────────────────────────────────────────
  # Linux
  # ─────────────────────────────────────────
  linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qtshadertools'
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev libgl1-mesa-dev libxkbcommon-dev libegl1

      - name: Build
        run: |
          export PATH="${Qt6_DIR}/bin:${PATH}"
          qmake Anchors.pro CONFIG+=release
          make -j$(nproc)

      - name: Locate binary
        id: bin
        run: |
          BIN=$(find . -type f -name Anchors -executable | head -1)
          echo "path=$BIN" >> "$GITHUB_OUTPUT"
          cp "$BIN" Anchors-linux-x86_64
          chmod +x Anchors-linux-x86_64

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: Anchors-linux-x86_64

  # ─────────────────────────────────────────
  # Windows
  # ─────────────────────────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          modules: 'qtshadertools'
          cache: true

      - name: Install libsodium (vcpkg)
        run: |
          vcpkg install libsodium:x64-windows
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          set PATH=%Qt6_DIR%\bin;%PATH%
          qmake Anchors.pro CONFIG+=release
          nmake

      - name: Deploy Qt + zip
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter Anchors.exe | Select-Object -First 1
          if (-not $exe) { throw "Anchors.exe not found" }
          $out = "dist-windows"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item $exe.FullName $out\
          & "$env:Qt6_DIR\bin\windeployqt.exe" --release --qmldir ui "$out\Anchors.exe"
          # sodium DLL from vcpkg
          $sodium = Get-ChildItem -Path "$env:VCPKG_ROOT\installed\x64-windows\bin" -Filter "libsodium*.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($sodium) { Copy-Item $sodium.FullName $out\ }
          Compress-Archive -Path "$out\*" -DestinationPath Anchors-windows-x64.zip -Force

      - name: Upload Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: Anchors-windows-x64.zip

  # ─────────────────────────────────────────
  # Publish GitHub Release
  # ─────────────────────────────────────────
  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Anchors ${{ github.ref_name }}
          body: |
            Automated build of **Anchors** `${{ github.ref_name }}`.

            - **Linux:** `Anchors-linux-x86_64` (needs Qt/libsodium on the system for this first CI version, or use a local AppImage)
            - **Windows:** `Anchors-windows-x64.zip` — extract and run `Anchors.exe`
          files: |
            artifacts/linux-binary/Anchors-linux-x86_64
            artifacts/windows-zip/Anchors-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
