name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────
  # Linux
  # ─────────────────────────────────────────
  linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: linux
          target: desktop
          modules: 'qtshadertools qtwebengine qtpositioning qtwebchannel'
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsodium-dev \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libegl1 \
            libfontconfig1-dev \
            libdbus-1-dev

      - name: Build
        run: |
          export PATH="${Qt6_DIR}/bin:${PATH}"
          cd notes-editor && npm ci && npm run build
          cd ..
          qmake Anchors.pro CONFIG+=release
          make -j"$(nproc)"

      - name: Locate binary
        run: |
          BIN="$(find . -type f -name Anchors -executable | head -1)"
          echo "Binary: $BIN"
          test -n "$BIN"
          cp "$BIN" Anchors-linux-x86_64
          chmod +x Anchors-linux-x86_64

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: Anchors-linux-x86_64
  # ------------------------------------
  # Flatpak
  # ------------------------------------
  flatpak:
    name: Flatpak
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.7
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # notes-editor/dist/ is gitignored (Vite content-hashes its filenames), so
      # there is no way to have the bundle inside the flatpak build without
      # either committing dist/ or building it here. Building it here keeps the
      # gitignore intact: a flatpak-builder `dir` source is a plain recursive
      # copy of the working tree - it does not consult .gitignore - so whatever
      # `npm run build` leaves in notes-editor/dist/ is exactly what the anchors
      # module sees, and the sandbox needs no Node at all.
      - name: Build notes editor bundle
        run: |
          cd notes-editor
          npm ci
          npm run build
          test -f dist/index.html
          test -f notes_editor.qrc

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Anchors.flatpak
          manifest-path: flatpak/org.anchors.Anchors.yml
          cache-key: flatpak-${{ runner.os }}-${{ hashFiles('flatpak/**', 'Anchors.pro', 'app/**', 'core/**', 'ui/**', 'notes-editor/package.json', 'notes-editor/package-lock.json', 'notes-editor/index.html', 'notes-editor/vite.config.ts', 'notes-editor/src/**', 'notes-editor/scripts/**') }}

      - name: Upload Flatpak
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: Anchors.flatpak
  # ─────────────────────────────────────────
  # Windows (MSVC - see the note on the Qt step below)
  # ─────────────────────────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # QtWebEngine is not published for win64_mingw: on the 6.7.3 branch the
      # MinGW kit offers qtpositioning / qtshadertools / qtwebchannel but no
      # qtwebengine at all, so install-qt-action could never satisfy
      # `QT += webenginequick` with that arch. Only the MSVC kits carry
      # QtWebEngine on Windows.
      #
      # There is no win64_msvc2022_64 package on 6.7.3 either - win64_msvc2019_64
      # is the only x64 MSVC kit on that branch. It is built with the v142
      # toolset and links fine from the v143 (VS2022) toolset windows-latest
      # ships; Qt ships one msvc2019 kit for both IDE generations on purpose.
      - name: Install Qt (MSVC)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          modules: 'qtshadertools qtwebengine qtpositioning qtwebchannel'
          cache: true

      - name: Enable MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install libsodium (vcpkg msvc)
        run: vcpkg install libsodium:x64-windows

      - name: Build
        shell: cmd
        run: |
          set PATH=%Qt6_DIR%\bin;%PATH%
          set VCPKG_ROOT=%VCPKG_INSTALLATION_ROOT%
          set INCLUDE=%VCPKG_ROOT%\installed\x64-windows\include;%INCLUDE%
          set LIB=%VCPKG_ROOT%\installed\x64-windows\lib;%LIB%
          set LIBPATH=%VCPKG_ROOT%\installed\x64-windows\lib;%LIBPATH%
          set PATH=%VCPKG_ROOT%\installed\x64-windows\bin;%PATH%

          where cl
          if errorlevel 1 exit /b 1
          where nmake
          if errorlevel 1 exit /b 1
          where qmake
          if errorlevel 1 exit /b 1

          cd notes-editor
          call npm ci
          if errorlevel 1 exit /b 1
          call npm run build
          if errorlevel 1 exit /b 1
          cd "%GITHUB_WORKSPACE%"

          if exist "%GITHUB_WORKSPACE%\build-win" rmdir /s /q "%GITHUB_WORKSPACE%\build-win"
          qmake Anchors.pro -spec win32-msvc CONFIG+=release DESTDIR=%GITHUB_WORKSPACE%\build-win
          if errorlevel 1 exit /b 1
          nmake /NOLOGO
          if errorlevel 1 exit /b 1

          if not exist "%GITHUB_WORKSPACE%\build-win\Anchors.exe" (
            echo === FATAL: build-win\Anchors.exe missing ===
            echo === All EXEs in workspace ===
            dir /s /b *.exe 2>&1
            exit /b 1
          )
          echo OK: Anchors.exe built

      - name: Stage deploy folder
        shell: pwsh
        run: |
          $exe = "$env:GITHUB_WORKSPACE\build-win\Anchors.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Anchors.exe not found at $exe despite a green Build step."
            exit 1
          }
          Write-Host "Found Anchors.exe: $exe"

          $out = "dist-windows"
          if (Test-Path $out) { Remove-Item -Recurse -Force $out }
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item $exe "$out\Anchors.exe"

          $windeploy = $null
          if ($env:Qt6_DIR -and (Test-Path "$env:Qt6_DIR\bin\windeployqt.exe")) {
            $windeploy = "$env:Qt6_DIR\bin\windeployqt.exe"
          }
          if (-not $windeploy) {
            $qmakeCmd = Get-Command qmake -ErrorAction SilentlyContinue
            if ($qmakeCmd) {
              $candidate = Join-Path (Split-Path $qmakeCmd.Source) "windeployqt.exe"
              if (Test-Path $candidate) { $windeploy = $candidate }
            }
          }
          if (-not $windeploy) {
            $windeploy = (
              Get-ChildItem -Path "D:\a", "C:\a" -Recurse -Filter "windeployqt.exe" -ErrorAction SilentlyContinue |
              Select-Object -First 1
            ).FullName
          }
          if (-not $windeploy -or -not (Test-Path $windeploy)) {
            throw "windeployqt.exe not found. Qt6_DIR='$($env:Qt6_DIR)'"
          }
          Write-Host "windeployqt: $windeploy"
          & $windeploy --release --qmldir ui "$out\Anchors.exe"
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed with $LASTEXITCODE" }

          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if ($vcpkg) {
            Get-ChildItem "$vcpkg\installed\x64-windows\bin\*sodium*.dll" -ErrorAction SilentlyContinue |
              ForEach-Object { Copy-Item $_.FullName $out }
          }

          # No MinGW runtime DLLs to add by hand: this is an MSVC build, and
          # windeployqt already copies the VC redistributables (vcruntime140,
          # msvcp140, concrt140) alongside QtWebEngineProcess.exe.

          Compress-Archive -Path "$out\*" -DestinationPath Anchors-windows-x64.zip -Force
          Write-Host "Created Anchors-windows-x64.zip"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          if (-not $ver) { $ver = "0.0.0" }
          Write-Host "Building installer version $ver"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" installer\Anchors.iss
          Get-ChildItem installer\output\

      - name: Upload Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: Anchors-windows-x64.zip

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: installer/output/Anchors-Setup-*.exe

  # ─────────────────────────────────────────
  # Publish GitHub Release
  # ─────────────────────────────────────────
  release:
    needs: [linux, windows, flatpak]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Anchors ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            Automated build of **Anchors** `${{ github.ref_name }}`.

            ### Downloads
            - **Windows installer:** `Anchors-Setup-*.exe` — full install, optional desktop shortcut
            - **Windows portable:** `Anchors-windows-x64.zip` — extract and run
            - **Linux:** `Anchors-linux-x86_64` — needs system Qt 6 + libsodium
          files: |
            artifacts/linux-binary/Anchors-linux-x86_64
            artifacts/windows-zip/Anchors-windows-x64.zip
            artifacts/windows-setup/Anchors-Setup-*.exe
            artifacts/flatpak-bundle/Anchors.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
