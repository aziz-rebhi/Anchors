app-id: org.anchors.Anchors
runtime: org.kde.Platform
runtime-version: '6.7'
sdk: org.kde.Sdk
command: Anchors

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - '*.a'
  - '*.la'

modules:
  - name: libsodium
    buildsystem: autotools
    config-opts:
      - --disable-static
      - --enable-shared
    sources:
      - type: archive
        url: https://download.libsodium.org/libsodium/releases/libsodium-1.0.20-stable.tar.gz
        sha256: b6b1d2a8802cd8bfa611638c0e9ce31d14ef324e16062c39a76854091cba6d7f

  - name: anchors
    buildsystem: simple
    build-commands:
      - qmake6 Anchors.pro CONFIG+=release PREFIX=/app || qmake Anchors.pro CONFIG+=release PREFIX=/app
      - make -j$FLATPAK_BUILDER_N_JOBS
      - install -Dm755 Anchors /app/bin/Anchors
      - install -Dm644 flatpak/org.anchors.Anchors.desktop /app/share/applications/org.anchors.Anchors.desktop
      - install -Dm644 flatpak/org.anchors.Anchors.metainfo.xml /app/share/metainfo/org.anchors.Anchors.metainfo.xml
      - install -Dm644 ui/logo.png /app/share/icons/hicolor/256x256/apps/org.anchors.Anchors.png
    sources:
      - type: dir
        path: ..
