app-id: org.anchors.Anchors
runtime: org.kde.Platform
runtime-version: '6.7'
sdk: org.kde.Sdk
# org.kde.Platform/SDK do not ship QtWebEngine at all - it is distributed
# separately as a base app pinned to the same runtime branch, so the Qt that
# QtWebEngine was built against is the Qt this runtime ships. Without this the
# qmake step dies with "Unknown module(s) in QT: webenginequick".
base: io.qt.qtwebengine.BaseApp
base-version: '6.7'
command: Anchors

finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # The base app puts QtWebEngineProcess in its own /app/bin, which is not on the
  # runtime's PATH. Without this the renderer process is never spawned and the
  # notes canvas stays blank.
  - --env=QTWEBENGINEPROCESS_PATH=/app/bin/QtWebEngineProcess
  # 6.7 predates the runtime shipping QML under /app/lib/qml, so the base app's
  # WebEngine QML plugins land in /app/qml instead. QML_IMPORT_PATH is additive
  # (per Qt's own docs), so this adds the base app's path without shadowing the
  # runtime's, and `import QtWebEngine` in NotesPageEditor.qml resolves.
  - --env=QML_IMPORT_PATH=/app/qml

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - '*.a'
  - '*.la'

# Strips the base app's build-time files (headers, mkspecs, cmake/pkgconfig).
# Runs after every module has been built, so the anchors module above can still
# compile against QtWebEngine.
cleanup-commands:
  - /app/cleanup-BaseApp.sh

modules:
  - name: libsodium
    buildsystem: autotools
    config-opts:
      - --disable-static
      - --enable-shared
    sources:
      - type: archive
        url: https://github.com/jedisct1/libsodium/releases/download/1.0.20-RELEASE/libsodium-1.0.20.tar.gz
        sha256: ebb65ef6ca439333c2bb41a0c1990587288da07f6c7fd07cb3a18cc18d30ce19

  - name: noto-color-emoji
    buildsystem: simple
    build-commands:
      - install -Dm644 NotoColorEmoji.ttf /app/share/fonts/noto/NotoColorEmoji.ttf
    sources:
      - type: file
        url: https://raw.githubusercontent.com/googlefonts/noto-emoji/v2.051/fonts/NotoColorEmoji.ttf
        dest-filename: NotoColorEmoji.ttf
        sha256: 72a635cb3d2f3524c51620cdde406b217204e8a6a06c6a096ff8ed4b5fd6e27b

  - name: anchors
    buildsystem: simple
    build-options:
      env:
        PKG_CONFIG_PATH: /app/lib/pkgconfig
        LIBRARY_PATH: /app/lib
        LD_LIBRARY_PATH: /app/lib
        CPLUS_INCLUDE_PATH: /app/include
        C_INCLUDE_PATH: /app/include
        # qmake finds Qt's per-module mkspecs/modules/*.pri through QMAKEPATH.
        # The base app keeps its own in /app, which is not a default search
        # location, so without this `QT += webenginequick` cannot be resolved.
        QMAKEPATH: /app
    build-commands:
      - |
        export LDFLAGS="-L/app/lib ${LDFLAGS:-}"
        export CXXFLAGS="-I/app/include ${CXXFLAGS:-}"
        export CFLAGS="-I/app/include ${CFLAGS:-}"
        VER="${FLATPAK_BUILDER_BUILD_VERSION:-}"
        if [ -z "$VER" ]; then VER="0.0.0"; fi
        qmake6 Anchors.pro CONFIG+=release PREFIX=/app VERSION="$VER" \
          "INCLUDEPATH+=/app/include" \
          "LIBS+=-L/app/lib -lsodium" \
          || qmake Anchors.pro CONFIG+=release PREFIX=/app VERSION="$VER" \
          "INCLUDEPATH+=/app/include" \
          "LIBS+=-L/app/lib -lsodium"
      - make -j"$FLATPAK_BUILDER_N_JOBS"
      - install -Dm755 Anchors /app/bin/Anchors
      - install -Dm644 flatpak/org.anchors.Anchors.desktop /app/share/applications/org.anchors.Anchors.desktop
      - install -Dm644 flatpak/org.anchors.Anchors.metainfo.xml /app/share/metainfo/org.anchors.Anchors.metainfo.xml
      - install -Dm644 ui/org.anchors.Anchors.png /app/share/icons/hicolor/256x256/apps/org.anchors.Anchors.png
    sources:
      - type: dir
        path: ..
        # A `dir` source is a verbatim recursive copy - it ignores .gitignore,
        # which is how notes-editor/dist/ gets in without committing it, but it
        # also means .git and node_modules would be copied too.
        skip:
          - .git
          - notes-editor/node_modules
